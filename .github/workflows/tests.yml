name: Tests
on:
  push:
    paths:
      - 'pivot_watch/**'
      - 'tests/**'
      - 'tradingview/**'
      - 'config.json'
      - '.github/workflows/**'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Offline demo smoke test
        run: python -m pivot_watch --demo --out demo-output --state demo-output/state.json
